<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chamado — Adicionar Técnico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse 600px 400px at 50% 100%, #0A1A0A 0%, #050805 60%, #000 100%);
      background-color: #000;
      color: #EDE8D6;
    }

    .emblem { margin-bottom: 1.4rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .emblem svg { width: 54px; height: 54px; }
    .emblem .title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #EDE8D6;
    }
    .emblem .title span { color: #C9A227; }
    .emblem .sub {
      font-size: 0.66rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(201,162,39,0.65);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      background: #0B0F08;
      border: 1px solid rgba(201,162,39,0.22);
      border-top: 2px solid #C9A227;
    }

    .field { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #D8B23A;
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: #000;
      border: 1px solid rgba(201,162,39,0.2);
      color: #EDE8D6;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input::placeholder { color: rgba(237,232,214,0.18); }
    input:focus { border-color: rgba(201,162,39,0.6); }

    button {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.75rem;
      background: #C9A227;
      border: none;
      color: #14170D;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover  { background: #E0B830; }
    button:active { background: #A8871C; }
    button:disabled { opacity: 0.5; cursor: default; }

    .response {
      margin-top: 1rem;
      font-size: 0.78rem;
      line-height: 1.5;
      white-space: pre-wrap;
      display: none;
      padding: 0.7rem 0.9rem;
      border-left: 2px solid transparent;
    }
    .response.visible { display: block; }
    .response.ok  { color: rgba(129,199,132,0.9); border-color: rgba(129,199,132,0.6); background: rgba(129,199,132,0.06); }
    .response.err { color: rgba(229,115,115,0.9); border-color: rgba(229,115,115,0.6); background: rgba(229,115,115,0.06); }

    .footer-link {
      margin-top: 1.6rem;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .footer-link a { color: rgba(201,162,39,0.7); text-decoration: none; border-bottom: 1px solid rgba(201,162,39,0.3); }
    .footer-link a:hover { color: #E0B830; }

    .list-card { margin-top: 1.4rem; }
    .list-card h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #D8B23A;
      margin-bottom: 1rem;
    }
    .tech-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .tech-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.8rem;
      border: 1px solid rgba(201,162,39,0.15);
      border-left: 2px solid rgba(201,162,39,0.4);
    }
    .tech-row .info { display: flex; flex-direction: column; gap: 0.15rem; }
    .tech-row .name { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 0.9rem; }
    .tech-row .team {
      font-size: 0.65rem;
      color: rgba(237,232,214,0.5);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .tech-row button {
      width: auto;
      margin-top: 0;
      padding: 0.4rem 0.9rem;
      background: rgba(229,115,115,0.85);
      color: #1A0505;
      font-size: 0.72rem;
    }
    .tech-row button:hover { background: #E57373; }
    .tech-empty {
      padding: 0.8rem 0;
      font-size: 0.78rem;
      color: rgba(237,232,214,0.35);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="emblem">
    <svg viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="46" stroke="#C9A227" stroke-width="2" opacity="0.55"/>
      <path d="M50 14 L59 39 L86 39 L64 55 L72 80 L50 64 L28 80 L36 55 L14 39 L41 39 Z"
            fill="#C9A227"/>
    </svg>
    <div class="title"><span>CHAMADO</span></div>
    <div class="sub">Adicionar Técnico</div>
  </div>

  <div class="card">
    <div class="field">
      <label for="techName">Nome</label>
      <input id="techName" type="text" placeholder="Nome completo" autocomplete="off">
    </div>
    <div class="field">
      <label for="techPassword">Senha</label>
      <input id="techPassword" type="password" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button id="btn" onclick="criarTecnico()">Adicionar Técnico</button>
    <div class="response" id="resp"></div>
  </div>

  <div class="card list-card">
    <h2>Técnicos Cadastrados</h2>
    <div class="response" id="listStatus"></div>
    <div class="tech-list" id="techList"></div>
  </div>

  <div class="footer-link"><a href="painel.html">Voltar ao Painel</a></div>

  <script>
    // Same host the page was loaded from, so this works whether opened via
    // localhost, a LAN IP, or a public IP/domain — only the port differs.
    const BASE = `${window.location.protocol}//${window.location.hostname}:8083`;
    const token = localStorage.getItem("chamadoToken") || "";
    const role  = localStorage.getItem("chamadoRole") || "";

    if (!token) window.location.href = "login.html";
    else if (role !== "admin") window.location.href = "painel.html";

    const TECH_SECTION = "TLM";

    async function criarTecnico() {
      const name     = document.getElementById("techName").value.trim();
      const password = document.getElementById("techPassword").value;
      const section  = TECH_SECTION;
      const btn      = document.getElementById("btn");

      if (!name || !password) {
        show("Preencha todos os campos.", "err");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Adicionando...";
      hide();

      try {
        const res = await fetch(BASE + "/user", {
          method: "POST",
          headers: {
            "Authorization": token,
            "Name": encodeURIComponent(name),
            "Password": password,
            "Team": encodeURIComponent(section)
          }
        });
        const json = await res.json().catch(() => null);

        if (json?.Code === 200) {
          show(`Técnico "${name}" criado com sucesso.`, "ok");
          document.getElementById("techName").value = "";
          document.getElementById("techPassword").value = "";
          loadTecnicos();
        } else if (res.status === 401 || res.status === 403) {
          show("Sessão expirada ou sem permissão. Faça login novamente.", "err");
          setTimeout(() => { window.location.href = "login.html"; }, 1500);
        } else {
          show(`Erro ${json?.Code ?? res.status}: ${json?.Message ?? "falha ao criar técnico"}`, "err");
        }
      } catch (err) {
        show("Falha na requisição:\n" + err, "err");
      } finally {
        btn.disabled = false;
        btn.textContent = "Adicionar Técnico";
      }
    }

    function show(text, cls) {
      const el = document.getElementById("resp");
      el.textContent = text;
      el.className = "response visible " + cls;
    }

    function hide() {
      document.getElementById("resp").className = "response";
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function showListStatus(text, cls) {
      const el = document.getElementById("listStatus");
      el.textContent = text;
      el.className = "response visible " + cls;
    }

    async function loadTecnicos() {
      const listEl = document.getElementById("techList");
      try {
        const res = await fetch(BASE + "/user", {
          method: "GET",
          headers: { "Authorization": token, "Mode": "all", "Role": "technician" }
        });
        const json = await res.json().catch(() => null);

        if (json?.Code === 200) {
          const users = json.Users || [];
          listEl.innerHTML = users.length
            ? users.map(u => `
                <div class="tech-row" data-name="${escapeHtml(u.Name)}">
                  <div class="info">
                    <span class="name">${escapeHtml(u.Name)}</span>
                    <span class="team">${escapeHtml(u.Team)}</span>
                  </div>
                  <button class="del-tech-btn">Excluir</button>
                </div>
              `).join("")
            : `<div class="tech-empty">Nenhum técnico cadastrado.</div>`;
          document.getElementById("listStatus").className = "response";
        } else {
          showListStatus(`Erro ${json?.Code ?? res.status}: ${json?.Message ?? "falha ao listar técnicos"}`, "err");
        }
      } catch (err) {
        showListStatus("Falha na requisição: " + err, "err");
      }
    }

    document.getElementById("techList").addEventListener("click", (e) => {
      const btn = e.target.closest(".del-tech-btn");
      if (!btn) return;
      const name = btn.closest(".tech-row").dataset.name;
      excluirTecnico(name);
    });

    async function excluirTecnico(name) {
      if (!confirm(`Excluir o técnico "${name}"? Esta ação não pode ser desfeita.`)) return;

      try {
        const res = await fetch(BASE + "/user", {
          method: "DELETE",
          headers: { "Authorization": token, "Name": encodeURIComponent(name) }
        });
        const json = await res.json().catch(() => null);

        if (json?.Code === 200) {
          loadTecnicos();
        } else {
          showListStatus(`Erro ${json?.Code ?? res.status}: ${json?.Message ?? "falha ao excluir técnico"}`, "err");
        }
      } catch (err) {
        showListStatus("Falha na requisição: " + err, "err");
      }
    }

    loadTecnicos();
  </script>
</body>
</html>
